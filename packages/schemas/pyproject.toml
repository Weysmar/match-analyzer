[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "ma-schemas"
version = "0.0.0"
description = "Loads the output schemas of the parser and validates documents against them."
requires-python = ">=3.14"
dependencies = ["jsonschema==4.26.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/ma_schemas"]

[tool.hatch.build.targets.wheel.force-include]
"header.schema.json" = "ma_schemas/header.schema.json"
"events.schema.json" = "ma_schemas/events.schema.json"
"frames.schema.json" = "ma_schemas/frames.schema.json"
"match2d.schema.json" = "ma_schemas/match2d.schema.json"
