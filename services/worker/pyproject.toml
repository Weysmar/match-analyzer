[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "ma-worker"
version = "0.0.0"
description = "Job worker: parse, store and analyze replays."
requires-python = ">=3.14"
dependencies = [
    "boto3==1.43.126",
    "ma-schemas",
    "psycopg[binary]==3.3.8",
]

[project.scripts]
ma-worker = "ma_worker.cli:main"

[tool.uv.sources]
ma-schemas = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/ma_worker"]
