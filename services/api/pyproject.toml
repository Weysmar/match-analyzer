[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "ma-api"
version = "0.0.0"
description = "HTTP API: sessions, sign-in, uploads, matches and stats."
requires-python = ">=3.14"
dependencies = [
    "boto3==1.43.126",
    "fastapi==0.162.2",
    "httpx2==2.16.0",
    "psycopg[binary]==3.3.8",
    "psycopg-pool==3.3.3",
    "uvicorn==0.54.0",
]

[project.scripts]
ma-api = "ma_api.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ma_api"]
