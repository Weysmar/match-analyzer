name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.13.7"

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            games/rocket-league/parser/target
          key: rust-debug-${{ hashFiles('rust-toolchain.toml', 'games/rocket-league/parser/Cargo.lock') }}
          # A new lock file still reuses what did not change.
          restore-keys: rust-debug-
      # rust-toolchain.toml selects the toolchain; rustup is on the runner.
      - run: cargo fmt --manifest-path games/rocket-league/parser/Cargo.toml --check
      - run: cargo clippy --manifest-path games/rocket-league/parser/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo test --manifest-path games/rocket-league/parser/Cargo.toml --locked

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --all-packages --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest
      # The site's copy of the API's description follows the API's code.
      - run: uv run python scripts/openapi.py --check

  typescript:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: The site's API types follow openapi.json
        run: |
          pnpm --filter @match-analyzer/api-types gen
          git diff --exit-code -- apps/web/src/lib/api/schema.ts
      - run: pnpm --filter @match-analyzer/web build

  # Migrations, constraints, roles and erasure, on PostgreSQL 16.
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --all-packages --locked
      - run: uv run pytest -m db

  # The development stack starts, and the S3 store behaves as uploads expect.
  stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - run: cp .env.example .env
      - run: docker compose -f compose.dev.yaml up -d --wait
      - run: uv sync --all-packages --locked
      - name: S3 checks
        run: |
          set -a; . ./.env; set +a
          uv run python scripts/s3_init.py
          uv run python scripts/s3_check.py
          uv run ma-db upgrade
          uv run pytest -m s3
          uv run python -c "import os, psycopg; print(psycopg.connect(os.environ['API_DATABASE_URL']).execute('SELECT current_user').fetchone())"
      - run: docker compose -f compose.dev.yaml exec -T db pg_isready -U ma_dev
      # The site's upload engine, from the API to the S3 store (T8.4).
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Upload engine against the API and the S3 store
        run: |
          set -a; . ./.env; set +a
          uv run ma-api > api.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1:8000/health && break; sleep 0.5; done
          WEB_IT_API_URL=http://127.0.0.1:8000 pnpm --filter @match-analyzer/web exec vitest run test/it
      - run: cat api.log
        if: failure()
      - run: docker compose -f compose.dev.yaml logs
        if: failure()

  # The production images build, and the production stack starts (T9.1, T9.2): compose.yaml with an
  # S3 emulator in place of R2. The layers are cached by GitHub Actions, shared with the release:
  # a change that leaves the parser alone reuses the compiled binary.
  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Migrations and backups
        uses: docker/build-push-action@v6
        with:
          context: .
          file: db/Dockerfile
          tags: ghcr.io/weysmar/match-analyzer-db:ci
          load: true
          cache-from: type=gha,scope=db
          cache-to: type=gha,scope=db,mode=max
      - name: API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/api/Dockerfile
          tags: ghcr.io/weysmar/match-analyzer-api:ci
          load: true
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: Worker and parser
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/worker/Dockerfile
          tags: ghcr.io/weysmar/match-analyzer-worker:ci
          load: true
          cache-from: type=gha,scope=worker
          cache-to: type=gha,scope=worker,mode=max
      - name: Site
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          build-args: API_INTERNAL_URL=http://api:8000
          tags: ghcr.io/weysmar/match-analyzer-web:ci
          load: true
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
      - run: docker run --rm --entrypoint rl-parse ghcr.io/weysmar/match-analyzer-worker:ci --version
      - name: The stack starts
        run: scripts/check-production-stack.sh
      - name: Service logs
        if: failure()
        # Nothing here names a player: the stack has seen no replay.
        run: docker compose -f compose.yaml -f .github/compose.ci.yaml --env-file .github/ci.env logs --tail 60

  # No replay here, ever: the repository is public and replays hold other players' names. The
  # checks on real replays run locally, on demand: `just test-replays`, `just test-pipeline`
  # and `just test-e2e`, whose journey uploads one.
