name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.13.7"

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            games/rocket-league/parser/target
          key: rust-debug-${{ hashFiles('rust-toolchain.toml', 'games/rocket-league/parser/Cargo.lock') }}
          # A new lock file still reuses what did not change.
          restore-keys: rust-debug-
      # rust-toolchain.toml selects the toolchain; rustup is on the runner.
      - run: cargo fmt --manifest-path games/rocket-league/parser/Cargo.toml --check
      - run: cargo clippy --manifest-path games/rocket-league/parser/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo test --manifest-path games/rocket-league/parser/Cargo.toml --locked

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --all-packages --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  # Migrations, constraints, roles and erasure, on PostgreSQL 16.
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --all-packages --locked
      - run: uv run pytest -m db

  # The development stack starts, and the S3 store behaves as uploads expect.
  stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - run: cp .env.example .env
      - run: docker compose -f compose.dev.yaml up -d --wait
      - run: uv sync --all-packages --locked
      - name: S3 checks
        run: |
          set -a; . ./.env; set +a
          uv run python scripts/s3_init.py
          uv run python scripts/s3_check.py
          uv run ma-db upgrade
          uv run pytest -m s3
          uv run python -c "import os, psycopg; print(psycopg.connect(os.environ['API_DATABASE_URL']).execute('SELECT current_user').fetchone())"
      - run: docker compose -f compose.dev.yaml exec -T db pg_isready -U ma_dev
      - run: docker compose -f compose.dev.yaml logs
        if: failure()

  # Public replays only; they are cached, never committed. Personal replays are checked locally.
  replays:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - uses: actions/cache@v6
        with:
          path: tests/fixtures/replays/public
          key: replays-${{ hashFiles('tests/fixtures/manifest.toml') }}
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            games/rocket-league/parser/target
          key: rust-release-${{ hashFiles('rust-toolchain.toml', 'games/rocket-league/parser/Cargo.lock') }}
          # A new lock file still reuses what did not change.
          restore-keys: rust-release-
      - run: uv sync --all-packages --locked
      - run: uv run python tests/fixtures/corpus.py fetch
      - run: uv run python tests/fixtures/corpus.py check
      - run: cargo build --release --locked --manifest-path games/rocket-league/parser/Cargo.toml
      - run: cargo test --release --locked --manifest-path games/rocket-league/parser/Cargo.toml --test corpus -- --include-ignored --test-threads=4
      # subtr-actor is slow on long replays: its statistics are cached like the replays.
      - uses: actions/cache@v6
        with:
          path: tests/fixtures/oracle
          key: oracle-${{ hashFiles('tests/fixtures/manifest.toml', 'games/rocket-league/parser/Cargo.lock', 'games/rocket-league/parser/src/bin/rl-oracle.rs') }}
      - run: uv run python tests/fixtures/oracle.py build
      - run: uv run pytest -m replays
      # Real replays, from the API to the database. Public ones only here, personal ones locally.
      - run: cp .env.example .env
      - run: docker compose -f compose.dev.yaml up -d --wait
      - name: Pipeline
        run: |
          set -a; . ./.env; set +a
          uv run python scripts/s3_init.py
          uv run pytest -m pipeline
      - run: docker compose -f compose.dev.yaml logs
        if: failure()

  parser-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t rl-parse games/rocket-league/parser
      - run: docker run --rm rl-parse --version
