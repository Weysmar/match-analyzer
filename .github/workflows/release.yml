name: Release

# The production images (T9.3 of docs/PLAN.md), built from main and published on GHCR, tagged with
# the commit and with `main`. Dokploy pulls them (compose.yaml, IMAGE_TAG). They share the layer
# cache of the CI's `images` job: a release after a green CI is mostly cache hits.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        image:
          - { name: api, dockerfile: services/api/Dockerfile }
          - { name: db, dockerfile: db/Dockerfile }
          - { name: worker, dockerfile: services/worker/Dockerfile }
          - { name: web, dockerfile: apps/web/Dockerfile }
    steps:
      - uses: actions/checkout@v7
      - name: The commit's short id
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          build-args: API_INTERNAL_URL=http://api:8000
          push: true
          tags: |
            ghcr.io/weysmar/match-analyzer-${{ matrix.image.name }}:sha-${{ env.SHORT_SHA }}
            ghcr.io/weysmar/match-analyzer-${{ matrix.image.name }}:main
          labels: |
            org.opencontainers.image.source=https://github.com/Weysmar/match-analyzer
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,scope=${{ matrix.image.name }},mode=max
